[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researchai-backend"
version = "0.1.0"
description = "Backend microservices for ResearchAI - AI Research Paper Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "arrathikan", email = "aravinthanarrathikan@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.29.0,<0.35.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "motor>=3.4.0,<4.0.0",
    "pymongo>=4.6.0,<5.0.0",
    "pika>=1.3.2,<2.0.0",
    "aio-pika>=9.4.0,<10.0.0",
    "llama-cloud>=2.19.0,<3.0.0",
    "langchain>=0.2.0,<0.4.0",
    "langchain-community>=0.2.0,<0.4.0",
    "langchain-text-splitters>=0.2.0,<0.4.0",
    "voyageai>=0.2.3,<1.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
    "langgraph>=0.1.0,<0.3.0",
    "python-multipart>=0.0.9,<0.1.0",
    "pypdf>=6.21.4,<7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0,<1.0.0",
    "ragas>=0.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
markers = ["integration: opt-in tests against an isolated real MongoDB database"]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
